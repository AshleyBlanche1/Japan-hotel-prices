name: Daily hotel price check

on:
  schedule:
    - cron: "23 6 * * *"   # 06:23 UTC every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_serpapi.py
      - name: Google Hotels prices (SerpApi, every third day)
        continue-on-error: true
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python -u serpapi_check.py
      - name: Google Hotels prices (Bright Data, daily)
        continue-on-error: true
        timeout-minutes: 15
        env:
          BRIGHTDATA_KEY: ${{ secrets.BRIGHTDATA_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python -u brightdata_check.py
      - name: Save results
        if: always()
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Prices $(date -u +%F)"
          git push
