name: Booking.com daily prices

# Daily Booking.com check for all 21 options. Writes data/booking_latest.json (and
# data/booking_hotel_ids.json if a new hotel id was looked up) and commits it to main.
# A Claude task reads the file at 07:00 UK time (06:00 UTC in summer), so this runs at 05:30 UTC.
#
# If Booking.com shows a robot check, the "retry" job waits five minutes and makes ONE second
# attempt on a fresh GitHub server, asking only about the options not yet priced.
# The evening run (17:30 UTC) does nothing if today's file is already clean; otherwise it makes
# one more attempt for the options with a robot check or error (or a full run if there is no
# file for today, e.g. the morning run never happened). No five-minute retry in the evening.
# So at most three attempts a day; then nothing more is asked until the next day.
#
# The run is marked FAILED (GitHub e-mails a failed-run notice) when, after any second attempt,
# Booking.com still shows a robot check, any option has an "error: ..." status, fewer than 18 of
# 21 are priced, the file is not today's, the script crashes or a push is rejected. "sold out"
# is not an error. Files are committed before the check, so a bad day is visible in the data.

on:
  schedule:
    - cron: "30 5 * * *"    # 05:30 UTC every day
    - cron: "30 17 * * *"   # 17:30 UTC evening attempt, only acts if today has no clean result
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: booking
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      blocked: ${{ steps.prices.outputs.blocked }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - run: python tests/test_booking.py
      - name: Booking.com prices (all 21 options)
        id: prices
        env:
          EVENING: ${{ github.event.schedule == '30 17 * * *' }}
        run: |
          if [ "$EVENING" = "true" ]; then python -u booking_check.py --write --evening
          else python -u booking_check.py --write; fi
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/booking_latest.json data/booking_hotel_ids.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          if [ "${{ github.event.schedule }}" = "30 17 * * *" ]; then WHEN=" (evening attempt)"; else WHEN=""; fi
          git commit -m "Booking.com prices $(TZ=Europe/London date +%F)$WHEN"
          git pull --rebase origin main
          git push

  retry:
    needs: check
    if: needs.check.outputs.blocked == 'true' && github.event.schedule != '30 17 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait five minutes
        run: sleep 300
      - uses: actions/checkout@v4
        with:
          ref: main   # includes the first attempt's commit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3
      - name: Second attempt (only options not yet priced)
        run: python -u booking_check.py --write --retry-robot-check
      - name: Commit
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data/booking_latest.json data/booking_hotel_ids.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Booking.com prices $(TZ=Europe/London date +%F) (second attempt)"
          git pull --rebase origin main
          git push

  report:
    needs: [check, retry]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the latest committed file
      - name: Flag problems
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          RETRY_RESULT: ${{ needs.retry.result }}
        run: |
          python - <<'EOF'
          import json, os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo
          problems = []
          check, retry = os.environ["CHECK_RESULT"], os.environ["RETRY_RESULT"]
          if check != "success":
              problems.append(f"first attempt job: {check}")
          if retry not in ("success", "skipped"):
              problems.append(f"second attempt job: {retry}")
          d = json.load(open("data/booking_latest.json"))
          rs = d["results"]
          priced = [r for r in rs if r["status"] in ("ok", "non-refundable only")]
          today = datetime.now(ZoneInfo("Europe/London")).date().isoformat()
          if d["date"] != today:
              problems.append(f"file is dated {d['date']}, not today ({today})")
          if len(rs) != 21:
              problems.append(f"{len(rs)} results instead of 21")
          if any(r["status"] == "robot check" for r in rs):
              problems.append("Booking.com still showed a robot check after this run's attempts")
          if len(priced) < 18:
              problems.append(f"only {len(priced)} of 21 options priced")
          for r in rs:
              if r["status"].startswith("error"):
                  problems.append(f"{r['option_id']}: {r['status']}")
          second = "used" if retry == "success" else ("not needed" if retry == "skipped" else retry)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"**{len(priced)} of {len(rs)} priced** ({d['date']}, runner {d['runner']}; "
                      f"second attempt: {second})\n\n")
              f.write("| option | status | price_gbp | price_any_gbp | room |\n|---|---|---|---|---|\n")
              for r in rs:
                  f.write(f"| {r['option_id']} | {r['status']} | {r['price_gbp']} | {r['price_any_gbp']} | {r['room']} |\n")
          for p in problems:
              print(f"::error::{p}")
          print(f"{len(priced)} of {len(rs)} priced; second attempt {second}; {len(problems)} problem(s)")
          sys.exit(1 if problems else 0)
          EOF
